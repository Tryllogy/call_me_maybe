[project]
name = "call_me_maybe"
version = "0.1.0"
description = "A Python SDK for LLM-based agents and tools."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "flake8>=5.0.0",
    "mypy>=0.910",
]

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
follow_imports = "skip"
ignore_errors = true
